spring:
  datasource:
    url: jdbc:postgresql://dev.oorjaa.tech:5432/demo
    username: demo_user
    password: ${DB_PASSWORD:jgjg90KD#22} # Use environment variable in production
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 3
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: db_demo_service
        # Enable bytecode enhancement
        enhance:
          enableLazyInitialization: true
          enableDirtyTracking: true
        # Enable batch fetching
        default_batch_fetch_size: 100
    show-sql: true
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.base-url}/realms/${keycloak.realm}
          jwk-set-uri: ${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
logging:
  level:
    root: INFO
    tech.oorjaa: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
keycloak:
  base-url: http://4.213.126.121:8083
  realm: DEMO
  client-id: demo-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET:GGeY0mL9xPYmz1hNLy70yEcA3cV8OdDQ} # Use environment variable in production
springdoc:
  swagger-ui:
    oauth2-redirect-url: http://74.225.167.178:8080/api/swagger-ui/oauth2-redirect.html
    use-root-path: true
    display-request-duration: true
    oauth:
      client-id: ${keycloak.client-id}
      client-secret: ${keycloak.client-secret}
      scopes: openid, profile
  oAuthFlow:
    authorizationUrl: ${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/auth
    tokenUrl: ${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/token
    scopes:
      openid: OpenID scope
      profile: Profile scope
app.exposeSwagger: true