plugins {
    id 'java-library'
    id 'maven-publish'

    // ✅ Spring Boot plugin
    id 'org.springframework.boot' version '3.5.4'
    // ✅ Dependency management plugin for BOM imports
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'tech.oorjaa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {

    // ✅ Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // JPA and Hibernate for entities
    api 'org.springframework.data:spring-data-jpa:3.4.1'
    api 'org.hibernate.orm:hibernate-core:6.6.3.Final'

    // Validation
    api 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // Persistence API
    api 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // MapStruct
    api 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    // Hibernate types
    api 'com.vladmihalcea:hibernate-types-60:2.21.1'

    // Utils
    api 'org.apache.commons:commons-lang3:3.13.0'

    // Swagger / OpenAPI for Spring Boot
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    api 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    // Tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Suppress Javadoc warnings
javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.author = false
    options.version = false
    options.use = false
}

// ✅ Publishing to GitHub Packages
publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Yatnavat/datashastra-common-library")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        create("gpr", MavenPublication) {
            from components.java

            pom {
                name.set("datashastra-common-library")
                description.set("A library containing JPA entities and models for Spring applications")
                url.set("https://github.com/Yatnavat/datashastra-common-library")

                licenses {
                    license {
                        name.set("The Apache License, Version 2.0")
                        url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                    }
                }
            }
        }
    }
}
