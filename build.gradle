import org.owasp.dependencycheck.reporting.ReportGenerator

plugins {
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'java-library'
	id "org.owasp.dependencycheck" version "7.1.0.1"
}

group = 'tech.oorjaa'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-bootstrap', version: '3.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
}

test {
	useJUnitPlatform()
}


dependencyCheck {
	failOnError = false
	formats = [ReportGenerator.Format.HTML,
			   ReportGenerator.Format.JUNIT]

	// set up a quality gate for vulnerabilities with low severity level:
	//   let's consider that a vulnerability has a low severity level if its CVSS score is higher than 0.1
	//   the build is going to fail if vulnerabilities with low severity level found
	failBuildOnCVSS = 0.1F
	// specify a list of known issues which contain:
	//   false-positives
	//   confirmed vulnerabilities which are not fixed yet, but we have a ticket for that
	suppressionFile = "suppressions.xml"
}
